<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLR TrueCentral VMS</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <!-- Pantallas de acceso (setup inicial / login / cambio de clave) -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark logo"><img src="logo.png" alt=""></div>
        <div>
          <h1>CLR TrueCentral <span class="accent">VMS</span></h1>
          <p class="muted" id="auth-subtitle">Gestión de video multimarca</p>
        </div>
      </div>
      <div id="auth-body"><!-- lo llena app.js --></div>
      <p class="auth-version muted" id="auth-version"></p>
    </div>
  </div>

  <!-- Aplicación -->
  <div id="app-shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand small">
        <div class="brand-mark logo"><img src="logo.png" alt=""></div>
        <span>TrueCentral <span class="accent">VMS</span></span>
      </div>
      <nav id="nav">
        <a href="#/" data-route="dashboard">Panel</a>

        <div class="nav-divider">Configuración</div>

        <div class="nav-group" data-group="devices">
          <button type="button" class="nav-toggle">
            <span class="caret" aria-hidden="true"></span><span>Dispositivos</span>
          </button>
          <div class="nav-children">
            <a href="#/devices" data-route="devices">Fuentes de video</a>
            <a href="#/alarm-panels" data-route="alarm-panels">Paneles de alarma</a>
            <a href="#/speakers" data-route="speakers">Parlantes IP</a>
            <div class="nav-group" data-group="videowall">
              <button type="button" class="nav-toggle">
                <span class="caret" aria-hidden="true"></span><span>Videowall</span>
              </button>
              <div class="nav-children">
                <a href="#/walls" data-route="walls">Muro de video</a>
                <a href="#/decoders" data-route="decoders">Decodificadores</a>
              </div>
            </div>
          </div>
        </div>

        <a href="#/workflows" data-route="workflows">Automatizaciones</a>

        <div class="nav-group" data-group="security">
          <button type="button" class="nav-toggle">
            <span class="caret" aria-hidden="true"></span><span>Seguridad</span>
          </button>
          <div class="nav-children">
            <a href="#/users" data-route="users">Usuarios</a>
            <a href="#/audit" data-route="audit">Auditoría</a>
          </div>
        </div>

        <div class="nav-group" data-group="streaming">
          <button type="button" class="nav-toggle">
            <span class="caret" aria-hidden="true"></span><span>Streaming</span>
          </button>
          <div class="nav-children">
            <a href="#/sessions" data-route="sessions">Sesiones</a>
          </div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <span id="conn-dot" class="dot ok" title="Conexión con el servidor"></span>
        <span id="conn-text" class="muted">Conectado</span>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h2 id="page-title">Panel</h2>
        <div class="topbar-user">
          <span id="current-user" class="muted"></span>
          <button class="btn ghost" id="btn-logout">Cerrar sesión</button>
        </div>
      </header>
      <main id="view"><!-- lo llena app.js --></main>
    </div>
  </div>

  <!-- Modal genérico -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal"><!-- lo llena app.js --></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="api.js?v=1"></script>
  <!-- walls.js va ANTES: app.js referencia sus funciones al armar las rutas. -->
  <script src="walls.js?v=2"></script>
  <script src="alarms.js?v=4"></script>
  <script src="speakers.js?v=7"></script>
  <script src="workflows.js?v=9"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
